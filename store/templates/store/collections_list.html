{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="bg-white">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex items-end justify-between gap-6 mb-10">
      <div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900">Collections</h1>
        <p class="text-gray-600 mt-2">Browse curated product collections.</p>
      </div>
    </div>

    {% if collections %}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for collection in collections %}
      <a href="{% url 'collection_detail' collection.slug %}" class="group rounded-2xl border shadow-sm hover:shadow-lg transition overflow-hidden bg-white">
        <div class="p-6">
          <div class="flex items-center justify-between gap-4">
            <div class="text-xl font-bold text-gray-900 group-hover:text-pink-600 transition">{{ collection.title }}</div>
            <div class="text-sm text-gray-500">→</div>
          </div>
          <div class="mt-2 text-sm text-gray-500">{{ collection.slug }}</div>
        </div>
      </a>
      {% endfor %}
    </div>
    {% else %}
    <div class="rounded-2xl border bg-gray-50 p-10 text-center text-gray-600">
      No collections yet.
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
